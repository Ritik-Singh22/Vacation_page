<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine's Day ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffe6ee, #fff5f8);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    .card {
        background: rgba(255, 255, 255, 0.85);
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(255, 105, 135, 0.3);
        z-index: 2;
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    p {
        color: #444;
        font-size: 18px;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        margin: 15px;
        transition: transform 0.3s ease;
    }

    #yes {
        background: #ff4d6d;
        color: white;
        box-shadow: 0 5px 15px rgba(255, 77, 109, 0.5);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    #no {
        background: #ffd6e0;
        color: #ff4d6d;
        position: absolute;
        top: 60%;
        left: 55%;
        z-index: 3;
    }

    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        color: #ff6f91;
        animation: floatUp 6s linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(1);
            opacity: 0.8;
        }
        100% {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Happy Valentine's Day ❤️</h1>
    <p>Will you be my Valentine forever bubu? 💕</p>
    <button id="yes" onclick="yesClicked()">Yes 😍</button>
</div>

<button id="no">No 🙃</button>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    let scale = 1;

    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        // Grow YES button
        scale += 0.15;
        yesBtn.style.transform =` scale(${scale})`;
    }

    // Desktop
    noBtn.addEventListener("mouseover", moveNoButton);

    // Mobile / touch
    noBtn.addEventListener("touchstart", moveNoButton);

    function yesClicked() {
        document.querySelector(".card").innerHTML = `
            <h1>Yayyy 💖</h1>
            <p>You chose YES 😍<br>
            I love you forever baua ❤️😘</p>
           ` ;
    }

    // Floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (4 + Math.random() * 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 7000);
    }, 300);
</script>

</body>
</html>
