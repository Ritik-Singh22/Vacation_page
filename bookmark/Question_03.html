<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
        }

        /* Background Gallery */
        .background-gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            z-index: -1;
        }

        .background-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        /* Form */
        form {
            width: 400px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6a5acd;
            box-shadow: 0 0 5px rgba(106, 90, 205, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6a5acd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #483d8b;
        }

        /* Footer */
        footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        footer h3 {
            margin-bottom: 8px;
        }

        footer p {
            margin: 4px 0;
        }

        /* Responsive */
        @media (max-width: 500px) {
            form {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Background Images -->
    <div class="background-gallery">
        <img src="train.jpg" alt="Train">
        <img src="images.jpg" alt="Vacation">
        <img src="airplane-take-off-on-blue-600nw-2662643431.webp" alt="Plane">
        <img src="images1.jpg" alt="Road Trip">
        <img src="train.jpg" alt="Train">
        <img src="airplane-take-off-on-blue-600nw-2662643431.webp" alt="Plane">
    </div>

    <!-- Registration Form -->
    <form>
        <h2>Vacation Registration</h2>

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input id="age" type="number" placeholder="Enter your age" required>
        </div>

        <div class="form-group">
            <label for="gmail">Gmail</label>
            <input id="gmail" type="email" placeholder="Enter your Gmail" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date" required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address"
                placeholder="Enter your address"></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>

    <!-- Footer -->
    <footer>
        <h3>Contact Us</h3>
        <p>📧 vacation@example.com</p>
        <p>📞 +91 9876543210</p>
        <p>📍 Bhagalpur, Bihar</p>
    </footer>

</body>

</html>
